services:
  encurtador-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encurtador-url-api
    ports:
        - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - redis
    networks:
        - encurtador-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: encurtador-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - encurtador-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  encurtador-network:
    driver: bridge

volumes:
  redis-data:
    driver: local