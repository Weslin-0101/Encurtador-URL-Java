version: '3.8'

services:
  encurtador-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encurtador-url-api
    ports:
        - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/app_database
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - db
    networks:
        - encurtador-network
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    container_name: encurtador-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=app_database
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - encurtador-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_database"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  encurtador-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local